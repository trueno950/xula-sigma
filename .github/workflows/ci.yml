name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC

jobs:
  estatico:
    name: Lint, tipos y capas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Los limites de capa. Violarlos rompe el build, no es sugerencia.
      - run: pnpm layers

  unitarios:
    name: Tests unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Sin `--coverage`: el piso se mide en el job de aislamiento, que es el
      # unico con Postgres. Midiendolo aca, todo lo que se prueba contra la
      # base daba 0% y la reja empujaba a escribir tests unitarios que no
      # prueban RLS. Ver el comentario de `coverage` en vitest.config.ts.
      - run: pnpm vitest run --project unit

  aislamiento:
    name: Integracion y aislamiento entre municipios
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xula_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Los roles no los crea una migracion: drizzle-kit se conecta con el
      # rol que este script crea, asi que no puede crearse a si mismo.
      - name: Provisionar roles
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/xula_test" \
            -v clave_migrator=postgres \
            -v clave_app=postgres \
            -v clave_super_admin=postgres \
            -f scripts/bootstrap.sql

      # Las migraciones corren con el rol owner, nunca con el de aplicacion
      # ni con el superusuario. Un superusuario ignora RLS siempre, asi que
      # migrar con el dejaria el aislamiento sin probar.
      - name: Migrar
        run: pnpm db:migrate
        env:
          MIGRATION_DATABASE_URL: postgresql://xula_migrator:postgres@localhost:5432/xula_test

      # Este es el job que no se negocia: si una tabla con ayuntamiento_id
      # quedo sin politica RLS, el build cae aca y no en produccion con el
      # segundo municipio.
      # La suite completa y no solo `integration`: el piso de cobertura sale
      # de aca, y con una sola de las dos mitades el numero miente.
      - name: Integracion y aislamiento
        run: pnpm vitest run --coverage
        env:
          DATABASE_URL: postgresql://xula_app:postgres@localhost:5432/xula_test
          MIGRATION_DATABASE_URL: postgresql://xula_migrator:postgres@localhost:5432/xula_test
          SUPER_ADMIN_DATABASE_URL: postgresql://xula_super_admin:postgres@localhost:5432/xula_test

  docs:
    name: Links de documentacion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validar links relativos
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress "**/*.md"
          fail: true

  revision:
    name: Revision de IA
    runs-on: ubuntu-latest
    # Solo en PR y solo si hay credencial. Sin secreto no falla el build:
    # la revision es una reja adicional, no la unica —en cada commit ya
    # corrio por el hook de pre-commit.
    #
    # Eso lo decia este comentario desde el principio y **no estaba
    # implementado**: el `if` miraba solo el tipo de evento, asi que sin
    # `DEEPSEEK_API_KEY` el job corria igual y rompia el build. Se vio en el
    # PR 1, la primera vez que CI llego a correr. La condicion va por paso y
    # no por job porque el contexto `secrets` no existe en el `if` de un job;
    # mapeada a `env` si se puede leer.
    if: github.event_name == 'pull_request'
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # `brew` NO viene en los runners de Ubuntu; solo en los de macOS. El
      # job moria con `brew: command not found` y codigo 127 antes de tocar
      # una linea de codigo. `gga` se distribuye por tap de Homebrew y no es
      # un script suelto —hace `source` de su `lib/`—, asi que no alcanza con
      # bajar un archivo. Esta es la accion oficial de Homebrew.
      - name: Instalar Homebrew
        if: env.DEEPSEEK_API_KEY != ''
        uses: Homebrew/actions/setup-homebrew@master

      - name: Instalar GGA y opencode
        if: env.DEEPSEEK_API_KEY != ''
        run: |
          brew install gentleman-programming/tap/gga
          npm install -g opencode-ai

      - name: Revisar el PR
        if: env.DEEPSEEK_API_KEY != ''
        env:
          GGA_OPENCODE_VARIANT: high
        run: gga run --pr-mode --diff-only
